name: dependabot auto-merge

# Fully automated merges for Dependabot pull requests — and ONLY Dependabot.
#
# Human PRs are unaffected: `main` is protected and still requires a passing
# review + checks from the sole maintainer (@Sam123ben). This workflow lets
# dependency bumps merge themselves *once every required status check is green*.
#
# How it satisfies branch protection without a human in the loop:
#   - `main` requires a CODEOWNERS review (@Sam123ben) and restricts merges to
#     @Sam123ben only. A bot token (GITHUB_TOKEN) is neither, so it cannot
#     approve-as-codeowner nor merge.
#   - So this job acts AS @Sam123ben via a Personal Access Token, approving the
#     PR (satisfies the code-owner review) and enabling auto-merge (GitHub then
#     squash-merges the moment all required checks pass).
#
# ONE-TIME SETUP (required for this to actually merge):
#   1. Create a fine-grained PAT owned by @Sam123ben, scoped to
#      tesserix/agentic-registry with: Pull requests = Read & write,
#      Contents = Read & write.
#   2. Add it as a **Dependabot** secret (NOT an Actions secret) named
#      DEPENDABOT_PAT:  Settings → Secrets and variables → Dependabot →
#      New repository secret. (Dependabot-triggered workflows can only read
#      Dependabot secrets.)
# Until that secret exists the PR is still approved/merged-blocked safely — it
# simply waits for a manual merge, never bypassing checks.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Guard: only ever act on Dependabot's own PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Gate on the presence of the maintainer PAT. Until it's configured this
      # job stays GREEN and simply no-ops (the PR waits for a manual merge) —
      # it never errors and never bypasses checks. See header for setup.
      - name: Check for maintainer PAT
        id: gate
        env:
          DEPENDABOT_PAT: ${{ secrets.DEPENDABOT_PAT }}
        run: |
          if [ -n "$DEPENDABOT_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPENDABOT_PAT not set — skipping auto-approve/merge. Add it as a Dependabot secret to enable fully automated merges."
          fi

      # Approve as the code owner (@Sam123ben) so the required code-owner review
      # is satisfied automatically.
      - name: Approve as code owner
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      # Enable auto-merge as @Sam123ben (the only actor allowed to merge to
      # main). GitHub completes the squash-merge once ALL required status checks
      # pass — builds are the gate, nothing merges red.
      #
      # To restrict to non-major updates only, uncomment the guard below:
      #   && steps.meta.outputs.update-type != 'version-update:semver-major'
      - name: Enable auto-merge
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
