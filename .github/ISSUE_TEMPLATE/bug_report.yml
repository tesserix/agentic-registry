name: Bug report
description: Report a defect in Agentic Registry
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the API endpoint or UI page, and the artifact kind if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /v0/skills with ...
        2. GET /v0/skills?labelSelector=...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store backend
      options: [memory, postgres]
    validations:
      required: true
