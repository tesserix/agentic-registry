metadata:
  name: senior-go-engineer
  visibility: public
  labels: { domain: code-review, language: go, stability: stable }
spec:
  title: Senior Go Engineer
  description: Writes and reviews production Go services with a strong emphasis on tests, concurrency safety, and clean interfaces.
