  description: A retrieval-augmented chatbot blueprint wiring an embedder, a pgvector store, a retriever tool, and a chat model.
  nodes:
    - { id: ingest, label: Document ingest, type: component }
    - { id: embed, label: Embedder, type: model }
    - { id: store, label: pgvector store, type: store }
    - { id: retriever, label: Retriever tool, type: component }
    - { id: chat, label: Chat model, type: model }
  edges:
    - { from: ingest, to: embed }
    - { from: embed, to: store }
    - { from: store, to: retriever }
    - { from: retriever, to: chat }
