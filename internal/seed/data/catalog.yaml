apiVersion: registry.agentic.dev/v1alpha1
kind: Workflow
metadata:
  name: release-train
  visibility: public
  labels: { domain: ci-cd }
spec:
  title: Release Train
  description: Builds, scans, tags, and promotes a service image through dev and prod stages with approval gates.
  nodes:
    - { id: build, label: Build image, type: start }
    - { id: scan, label: Trivy scan, type: task }
    - { id: dev, label: Deploy to dev, type: task }
    - { id: approve, label: Manual approval, type: approval }
    - { id: prod, label: Deploy to prod, type: task }
    - { id: done, label: Released, type: end }
  edges:
    - { from: build, to: scan }
    - { from: scan, to: dev, label: pass }
    - { from: dev, to: approve }
    - { from: approve, to: prod, label: approved }
    - { from: prod, to: done }
---
apiVersion: registry.agentic.dev/v1alpha1
kind: Workflow
metadata:
  name: triage-bug-report
  visibility: internal
  labels: { domain: support }
spec:
  title: Triage Bug Report
  description: Classifies an incoming bug report, reproduces it, links related issues, and assigns a severity.
  nodes:
    - { id: intake, label: Intake report, type: start }
    - { id: classify, label: Classify, type: task }
    - { id: repro, label: Reproduce, type: task }
    - { id: sev, label: "Severity?", type: gateway }
    - { id: assign, label: Assign owner, type: task }
    - { id: triaged, label: Triaged, type: end }
  edges:
    - { from: intake, to: classify }
    - { from: classify, to: repro }
    - { from: repro, to: sev }
    - { from: sev, to: assign, label: high }
    - { from: assign, to: triaged }
---
