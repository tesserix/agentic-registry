# Built-in starter catalog. Embedded into the binary and applied on first
# start (when the store is empty and SEED_EXAMPLES=true) so a fresh local
# install has a populated catalog and the ⌘K vector search has content to rank.
# Diverse artifacts across every kind. Safe to edit; re-seeding is idempotent.
