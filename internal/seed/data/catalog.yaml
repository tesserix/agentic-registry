apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: oncall-responder
  visibility: public
  labels: { domain: sre }
spec:
  title: On-Call Responder
  description: An autonomous agent that watches alerts, investigates Kubernetes and database health, and proposes remediations.
  # A2A (Agent2Agent) descriptor. The registry renders this into a standards
  # compliant Agent Card at /v0/agents/oncall-responder/card. `url` is the
  # agent's OWN live A2A endpoint - the registry never proxies it, it only
  # advertises it. Any extra fields here pass straight through to the card.
  a2a:
    url: https://oncall-responder.devai.svc.cluster.local/a2a/v1
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    documentationUrl: https://docs.tesserix.app/agents/oncall-responder
    capabilities:
      streaming: true
      pushNotifications: true
      stateTransitionHistory: false
    defaultInputModes: [application/json, text/plain]
    defaultOutputModes: [application/json, text/plain]
  # Skills: a name resolves to a real registry Skill (single source of truth);
  # a map is an inline one-off. Both end up in the card's skills[].
  skills:
    - kubernetes-troubleshooter
    - id: propose-remediation
      name: Propose Remediation
      description: Drafts a remediation plan (rollback, scale, patch) for a triaged incident and opens it as a PR.
      tags: [sre, remediation, automation]
      examples:
        - "Pod is CrashLoopBackOff after the last deploy - propose a fix."
