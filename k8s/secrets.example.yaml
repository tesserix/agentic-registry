# =============================================================================
# Agentic Registry — LOCAL secrets (kind / dev)
#
# This is the ONE secret the local deployment needs. In production these values
# come from GCP Secret Manager via an ExternalSecret and this file is NOT used —
# locally there is no Secret Manager, so you provide them directly.
#
# USAGE:
#   1. cp k8s/secrets.example.yaml k8s/secrets.yaml      # secrets.yaml is gitignored
#   2. edit the values below (the defaults work for the bundled local Postgres)
#   3. kubectl create namespace agentic-registry --dry-run=client -o yaml | kubectl apply -f -
#      kubectl apply -f k8s/secrets.yaml
#   4. helm upgrade --install agentic-registry deploy/helm \
#        -n agentic-registry -f deploy/helm/values-local.yaml
#
# The chart's values-local.yaml sets database.mode=existingSecret and
# postgresql.enabled=false, so the app reads DATABASE_URL from THIS secret and
# connects to the SHARED local-infra CNPG cluster (no bundled Postgres anymore).
#
# NOTE: the shared Secret "local-infra-creds" is REFLECTED into this namespace by
# reflector (ships with sandboxctl) and carries the same throwaway password
# ("local-sandbox-dev") for Postgres/Redis/Mongo. We embed it in DATABASE_URL
# below so the app needs nothing else.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agentic-registry-secrets
  namespace: agentic-registry
type: Opaque
stringData:
  # Full DSN the registry server connects with. Host is the SHARED local-infra
  # CNPG primary Service; db "registry", role "registry". Password matches the
  # shared CNPG role / reflected local-infra-creds ("local-sandbox-dev").
  DATABASE_URL: "postgres://registry:local-sandbox-dev@local-pg-rw.local-infra.svc.cluster.local:5432/registry?sslmode=disable"

  # ---------------------------------------------------------------------------
  # OPTIONAL — only if you run AUTH_MODE=jwks locally (e.g. against a local
  # Keycloak) and want devai to authenticate via OAuth client-credentials.
  # Leave unset for AUTH_MODE=anonymous (the local default = full access).
  # The registry itself NEVER needs a client secret — this is for the CONSUMER
  # side (devai); shown here only so you have the full picture in one place.
  # ---------------------------------------------------------------------------
  # REGISTRY_CLIENT_SECRET: "change-me-only-if-using-jwks"
