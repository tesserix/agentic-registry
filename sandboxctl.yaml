# sandboxctl.yaml — auto-generated by `sandboxctl build|deploy|bootstrap`
# when no manifest existed in this directory. Each entry is one image
# pushed to the in-cluster registry at localhost:5050/<name>:latest.
#
# Edit freely — sandboxctl will not overwrite an existing file.
# `aliases` + `depends_on` are inferred from FROM lines; override here
# if needed (manual entries are preserved across regeneration).
images:
  - name: deploy
    context: "."
    dockerfile: deploy/Dockerfile
