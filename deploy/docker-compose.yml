# Local full stack: Postgres + the registry (API + UI on :8080).
# `docker compose up` then open http://localhost:8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  registry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://registry:registry@postgres:5432/registry?sslmode=disable
      AUTO_MIGRATE: "true"        # OSS self-host applies the embedded schema
      AUTH_MODE: anonymous        # local dev = full access; use jwks in prod
      SIGNING_DEV: "true"         # ephemeral Ed25519 key so Agent Cards are
                                  # signed; a verifying A2A consumer (secure by
                                  # default) accepts them. Prod sets SIGNING_PRIVATE_KEY.
      WEB_DIR: /app/web
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
