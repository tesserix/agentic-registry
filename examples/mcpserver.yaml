# An MCP server. spec IS the server.json — portable to/from the MCP Registry.
apiVersion: registry.agentic.dev/v1alpha1
kind: MCPServer
metadata:
  name: io.github.acme/files
  tag: "1.0.0"
  visibility: public
  labels:
    transport: stdio
spec:
  name: io.github.acme/files
  version: "1.0.0"
  description: File operations over MCP.
  packages:
    - registryType: npm
      identifier: "@acme/files-mcp"
      transport:
        type: stdio
